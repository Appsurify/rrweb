<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter - Visual Coverage Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔢 Простой счётчик</h1>
            <p>Демонстрация Visual Coverage с Cypress</p>
        </header>

        <main>
            <div class="counter-container">
                <div class="counter-display">
                    <span id="counter-value">0</span>
                </div>
                <button id="increment-btn" class="btn">
                    Нажми меня! (+1)
                </button>
            </div>
        </main>

        <footer>
            <p>Visual Coverage Simple Demo</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
