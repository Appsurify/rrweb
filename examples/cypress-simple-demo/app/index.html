<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testmap Demo App - Feedback Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1 class="app-title">Testmap Demo App</h1>
            <nav class="header-nav">
                <button class="nav-button">Feedback</button>
                <button class="nav-button">Admin</button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="form-container">
            <h2 class="form-title">Feedback Form</h2>
            <p class="form-subtitle">Please fill in all fields to submit your feedback</p>

            <form id="feedback-form" class="feedback-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName" class="form-label">First Name *</label>
                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            class="form-input"
                            placeholder="Enter your first name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastName" class="form-label">Last Name *</label>
                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            class="form-input"
                            placeholder="Enter your last name"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="position" class="form-label">Position *</label>
                        <input
                            type="text"
                            id="position"
                            name="position"
                            class="form-input"
                            placeholder="Enter your position"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="country" class="form-label">Country *</label>
                        <input
                            type="text"
                            id="country"
                            name="country"
                            class="form-input"
                            placeholder="Enter your country"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="industry" class="form-label">Industry *</label>
                        <input
                            type="text"
                            id="industry"
                            name="industry"
                            class="form-input"
                            placeholder="Enter your industry"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="date" class="form-label">Date *</label>
                        <input
                            type="date"
                            id="date"
                            name="date"
                            class="form-input"
                            required
                        >
                    </div>
                </div>

                <div class="form-spacer"></div>

                <div class="form-group full-width">
                    <label for="message" class="form-label">Message *</label>
                    <textarea
                        id="message"
                        name="message"
                        class="form-textarea"
                        rows="8"
                        placeholder="Enter your message here..."
                        required
                    ></textarea>
                </div>

                <div class="form-spacer"></div>

                <div class="form-group full-width">
                    <button
                        type="submit"
                        id="submit-btn"
                        class="submit-button"
                        disabled
                    >
                        Submit Feedback
                    </button>
                </div>
              <div class="form-spacer"></div>
              <div class="form-spacer"></div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
